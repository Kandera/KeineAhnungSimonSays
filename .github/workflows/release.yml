name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      announce:
        description: "Post Discord changelog only (version without v, e.g. 1.1.0)"
        required: false
        default: ""
      dry_run:
        description: "Check webhook + changelog without posting"
        type: boolean
        required: false
        default: false
      curseforge:
        description: "Upload this git tag to CurseForge (e.g. v1.1.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pack:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack addon zip
        run: |
          mkdir -p dist/KeineAhnungSimonSays/media
          cp Bindings.xml CHANGELOG.md LICENSE README.md KeineAhnungSimonSays.toc dist/KeineAhnungSimonSays/
          cp Announce.lua Core.lua HUD.lua KASS.lua Options.lua Sim.lua dist/KeineAhnungSimonSays/
          cp media/*.ogg dist/KeineAhnungSimonSays/media/
          (cd dist && zip -r ../KeineAhnungSimonSays.zip KeineAhnungSimonSays)
          unzip -l KeineAhnungSimonSays.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: KeineAhnungSimonSays.zip
          name: ${{ github.ref_name }}
          body: |
            Download `KeineAhnungSimonSays.zip` below and extract it into `World of Warcraft\_retail_\Interface\AddOns\`, then restart the client.

            Use the zip attached here, **not** the green "Download ZIP" button — that one names the folder `KeineAhnungSimonSays-main` and the game will not find the addon.

            See [CHANGELOG.md](https://github.com/Kandera/KeineAhnungSimonSays/blob/main/CHANGELOG.md) for what changed.

  discord:
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && (inputs.announce != '' || inputs.dry_run)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post German changelog to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          DISPATCH_VERSION: ${{ inputs.announce }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v${VERSION}"

          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG-de.md \
            | sed 's/^### \(.*\)/**\1**/')

          if [ -z "$NOTES" ]; then
            echo "No changelog section found for $VERSION in CHANGELOG-de.md" >&2
            exit 1
          fi

          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK secret is not set" >&2
            exit 1
          fi

          # GET returns webhook metadata; it does not post a channel message.
          http=$(curl -sS -o /dev/null -w "%{http_code}" "$WEBHOOK_URL")
          if [ "$http" != "200" ]; then
            echo "Discord webhook GET returned HTTP $http (expected 200)" >&2
            exit 1
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "dry_run ok: webhook reachable, changelog for $VERSION is ${#NOTES} chars"
            exit 0
          fi

          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"

          post() {
            jq -n --arg title "$1" --arg desc "$2" --arg url "$RELEASE_URL" \
              '{embeds: [{title: $title, url: (if $title == "" then null else $url end), description: $desc, color: 15844367}]}' \
              | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
          }

          TITLE="KeineAhnungSimonSays v${VERSION}"
          CHUNK=""
          while IFS= read -r line; do
            if [ $(( ${#CHUNK} + ${#line} + 1 )) -gt 4000 ]; then
              post "$TITLE" "$CHUNK"
              TITLE=""
              CHUNK=""
            fi
            CHUNK+="$line"$'\n'
          done <<< "$NOTES"
          if [ -n "$CHUNK" ]; then post "$TITLE" "$CHUNK"; fi

  curseforge:
    # Pre-release tags only build the GitHub zip. Discord and CurseForge
    # run on final tags, or on a dispatch that names a tag to backfill.
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.curseforge != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.curseforge || github.ref }}

      - name: Use current pkgmeta when backfilling an older tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "origin/${{ github.event.repository.default_branch }}" -- .pkgmeta
          if ! grep -q "X-Curse-Project-ID" KeineAhnungSimonSays.toc; then
            printf '\n## X-Curse-Project-ID: 1650983\n' >> KeineAhnungSimonSays.toc
          fi

      - name: Require CurseForge token
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo "CF_API_TOKEN secret is not set on this repo" >&2
            exit 1
          fi

      - name: Package and upload to CurseForge
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1650983
        env:
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
