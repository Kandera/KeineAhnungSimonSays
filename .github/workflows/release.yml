name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      announce:
        description: "Post Discord changelog only (version without v, e.g. 1.1.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  pack:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack addon zip
        run: |
          mkdir -p dist/KeineAhnungSimonSays/media
          cp Bindings.xml CHANGELOG.md LICENSE README.md KeineAhnungSimonSays.toc dist/KeineAhnungSimonSays/
          cp Announce.lua Core.lua HUD.lua KASS.lua Options.lua Sim.lua dist/KeineAhnungSimonSays/
          cp media/*.ogg dist/KeineAhnungSimonSays/media/
          (cd dist && zip -r ../KeineAhnungSimonSays.zip KeineAhnungSimonSays)
          unzip -l KeineAhnungSimonSays.zip

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: KeineAhnungSimonSays.zip
          name: ${{ github.ref_name }}
          body: |
            Download `KeineAhnungSimonSays.zip` below and extract it into `World of Warcraft\_retail_\Interface\AddOns\`, then restart the client.

            Use the zip attached here, **not** the green "Download ZIP" button — that one names the folder `KeineAhnungSimonSays-main` and the game will not find the addon.

            See [CHANGELOG.md](https://github.com/Kandera/KeineAhnungSimonSays/blob/main/CHANGELOG.md) for what changed.

  discord:
    if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || (github.event_name == 'workflow_dispatch' && inputs.announce != '') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post German changelog to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK }}
          DISPATCH_VERSION: ${{ inputs.announce }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          TAG="v${VERSION}"

          NOTES=$(awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG-de.md \
            | sed 's/^### \(.*\)/**\1**/')

          if [ -z "$NOTES" ]; then
            echo "No changelog section found for $VERSION in CHANGELOG-de.md" >&2
            exit 1
          fi

          if [ -z "$WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK secret is not set" >&2
            exit 1
          fi

          RELEASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG}"

          post() {
            jq -n --arg title "$1" --arg desc "$2" --arg url "$RELEASE_URL" \
              '{embeds: [{title: $title, url: (if $title == "" then null else $url end), description: $desc, color: 15844367}]}' \
              | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
          }

          TITLE="KeineAhnungSimonSays v${VERSION}"
          CHUNK=""
          while IFS= read -r line; do
            if [ $(( ${#CHUNK} + ${#line} + 1 )) -gt 4000 ]; then
              post "$TITLE" "$CHUNK"
              TITLE=""
              CHUNK=""
            fi
            CHUNK+="$line"$'\n'
          done <<< "$NOTES"
          if [ -n "$CHUNK" ]; then post "$TITLE" "$CHUNK"; fi
